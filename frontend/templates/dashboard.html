{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="dashboard-header {{ role }}">
    <h1>{{ title }}</h1>
    <form action="{{ url_for('auth.logout') }}" method="post">
        <button type="submit" class="button button-secondary">Logout</button>
    </form>
</header>
<section class="dashboard-grid">
    <article class="dashboard-card"><h2>Account</h2><p>{{ session.name }}</p></article>
    <article class="dashboard-card"><h2>Status</h2><p>Role authenticated</p></article>
</section>
{% endblock %}
