{% extends "base.html" %}

{% block content %}
<header class="dashboard-header administrator">
    <h1>System Analytics</h1>
    <a class="button button-secondary" href="{{ url_for('admin.administrator_dashboard') }}">Back</a>
</header>
<section class="dashboard-grid">
    <article class="dashboard-card"><h2>Domestic Users</h2><strong>{{ domestic_users }}</strong></article>
    <article class="dashboard-card"><h2>Enterprise Users</h2><strong>{{ enterprise_users }}</strong></article>
    <article class="dashboard-card"><h2>Buildings</h2><strong>{{ buildings }}</strong></article>
    <article class="dashboard-card"><h2>Appliances</h2><strong>{{ appliances }}</strong></article>
</section>
{% endblock %}
